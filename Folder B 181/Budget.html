<!DOCTYPE html>
<html lang="en">

    <title>Receipt Processor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
    <h1>Calculate Budget</h1>
    <p>Insert the Details of at least 3 Products to Generate the Total Sum.</p>
    <form action="Receipt.php" method="POST">
    <h2>Item 1</h2>
    <label for="product1">Product Name</label>
    <input type="text" id="product1" name="product1" required>
    <label for="price1">Unit Price (R$)</label>
    <input type="number" id="price1" name="price1" step="0.01" min="0.01" required>
    <label for="qtd1">Quantity:</label>
    <input type="number" id="qtd1" name="qtd1" min="1" required>
    <hr>
    <h2>Item 2</h2>
    <label for="product"2>Product Name</label>

    <label for="qtd2">Quantity:</label>
    <input type="number" id="qtd2" name="qtd2" min="1" required>
    <hr>
    <h2>Item 3</h2>
    <label for="product3">Product Name</label>
    <input type="text" id="product3" name="product3" required>
    <label for="price3">Unit Price (R$)</label>
    <input type="number" id="price3" name="price3" step="0.01" min="0.01" required>

    <input type="number" id="qtd3" name="qtd3" min="1" required>
