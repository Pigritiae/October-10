<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>General Culture Quiz</h1>

        <div id="quiz">
            <div id="question"></div>
            <div id="answers"></div>
            <button id="nextButton">Next Question</button>
            <div id="score">Score:</div>
        </div>
        <h2>General Ranking</h2>
        <ol id="ranking"></ol>

        <div id="endScreen" style="display: none;">
            <h2>Game Over!</h2>
            <p>Your Final Score: <span id="finalScore"></span></p>
            <label for="playerName">Type Your Name:</label>
            <input type="text" id="playerName">
            <button id="saveScoreButton">Save Score</button>
        </div>
    </div>
    <script src="Culture Quiz.js"></script>
</body>
</html>
